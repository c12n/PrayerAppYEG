name: Build Wear APK

on:
  push:
    branches: [ main ]
    paths:
      - 'wearos/**'
      - '.github/workflows/build-wear.yml'
  workflow_dispatch:

jobs:
  build:
    name: Build Wear OS release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Run calculator validation tests
        working-directory: wearos
        run: gradle :app:testDebugUnitTest --stacktrace

      - name: Build release APK (debug signed, for sideload)
        working-directory: wearos
        run: gradle :app:assembleRelease --stacktrace

      - name: Stage artifact
        run: |
          mkdir -p build-artifacts
          cp wearos/app/build/outputs/apk/release/app-release.apk build-artifacts/PrayerYEG-Wear.apk
          ls -lh build-artifacts/PrayerYEG-Wear.apk

      - name: Upload Wear APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: PrayerYEG-Wear-APK
          path: build-artifacts/PrayerYEG-Wear.apk
          if-no-files-found: error
