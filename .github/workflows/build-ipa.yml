name: Build IPA

on:
  push:
    branches: [ main ]
    paths-ignore:
      - 'flutter/**'
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    name: Build unsigned IPA
    runs-on: [self-hosted, macOS, X64, macbook]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Build and archive (no code signing)
        run: |
          set -euo pipefail
          xcodebuild \
            -project AlRashidWidget.xcodeproj \
            -scheme AlRashidWidget \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/AlRashidWidget.xcarchive" \
            archive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM=""

      - name: Package IPA
        run: |
          set -euo pipefail
          APP_PATH="$RUNNER_TEMP/AlRashidWidget.xcarchive/Products/Applications/AlRashidWidget.app"
          test -d "$APP_PATH"
          test -d "$APP_PATH/PlugIns/PrayerWidgetExtension.appex"
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          mkdir -p build-artifacts
          zip -r "build-artifacts/AlRashidWidget.ipa" Payload
          ls -lh build-artifacts/AlRashidWidget.ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: AlRashidWidget-IPA
          path: build-artifacts/AlRashidWidget.ipa
          if-no-files-found: error
