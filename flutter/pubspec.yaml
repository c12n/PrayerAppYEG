name: alrashidwidget
description: "Al Rashid Prayer — Al Rashid Mosque Edmonton prayer times (Adhan calibrated to the mosque's published timetable), Iqamah, Umm al-Qura Hijri date, next-prayer countdown and home-screen widgets. Flutter edition; same times and design as the native iOS app."
publish_to: 'none'
version: 1.5.1+14

environment:
  sdk: '>=3.4.0 <4.0.0'
  flutter: '>=3.22.0'

dependencies:
  flutter:
    sdk: flutter
  timezone: ^0.10.1
  intl: ^0.20.2
  shared_preferences: ^2.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
